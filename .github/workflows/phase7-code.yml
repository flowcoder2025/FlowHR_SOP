name: Phase 7 Code Checks

# Phase 7 코드 게이트 — apps/** + packages/** 변경 시 lint/typecheck/unit-test/build 검증.
# mvp-plan.md §6 + sprint-001.md Day 13~14 (WI-021) SSOT.
# 와이어프레임 정적 체크(pr-checks.yml 9 job)와 path-scope 분리 — 코드 PR만 본 워크플로 트리거.

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'turbo.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/phase7-code.yml'

concurrency:
  group: phase7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-lint-${{ github.sha }}
          restore-keys: turbo-lint-
      - name: ESLint (turbo)
        run: pnpm turbo run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-typecheck-${{ github.sha }}
          restore-keys: turbo-typecheck-
      # turbo.json: typecheck dependsOn build → apps/web next build 가 .next/types 를
      # 먼저 생성하므로 tsc 가 라우트 생성 타입까지 포함해 완전 검증한다 (핸드오프 build→typecheck 순서).
      - name: tsc --noEmit (turbo, build 선행)
        run: pnpm turbo run typecheck

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-test-${{ github.sha }}
          restore-keys: turbo-test-
      - name: Vitest (turbo)
        run: pnpm turbo run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-${{ github.sha }}
          restore-keys: turbo-build-
      # turbo build = packages/schemas (zod-to-openapi → dist/openapi.yaml) + apps/web (next build)
      - name: Turbo build (web + schemas openapi)
        run: pnpm turbo run build
      - name: OpenAPI 명세 최신성 검증 (zod-to-openapi)
        shell: bash
        run: |
          # build 가 재생성한 packages/schemas/dist/openapi.yaml 이 커밋본과 일치해야 한다.
          # zod 스키마를 고치고 openapi.yaml 재생성/커밋을 누락하면 여기서 차단.
          if ! git diff --exit-code -- packages/schemas/dist/openapi.yaml; then
            echo "::error::openapi.yaml 이 zod 스키마와 불일치 — 'pnpm --filter @flowhr/schemas build' 후 dist/openapi.yaml 커밋 필요 (PR template 의무)"
            exit 1
          fi
          echo "OpenAPI 명세 최신 — zod 스키마와 일치"

  # ── KI-082: 로그인 E2E CI 자동화 (secrets 조건부) ──────────────────────────
  # repo secrets(NEXT_PUBLIC_SUPABASE_URL 등) 주입 시 실 staging 백엔드로 로그인 E2E 회귀.
  # 미설정 시 graceful skip — 4 필수 job 머지를 막지 않는 advisory 체크.
  e2e-gate:
    name: E2E Gate
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: secrets 주입 여부 확인
        id: check
        shell: bash
        env:
          URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          if [ -n "$URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "E2E secrets 감지 — 로그인 E2E 실행"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "E2E secrets 미설정 — 로그인 E2E skip (KI-082: repo secrets 주입 시 자동 활성)"
          fi

  e2e:
    name: Login E2E (staging)
    needs: e2e-gate
    if: needs.e2e-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_TEST_DASHBOARD: ${{ secrets.E2E_TEST_DASHBOARD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright chromium 설치 (루트 @playwright/test 1.60.0 일치)
        run: pnpm exec playwright install --with-deps chromium
      - name: apps/web 빌드 (next start webServer 전제)
        run: pnpm turbo run build --filter=@flowhr/web
      - name: 로그인 E2E (playwright)
        run: pnpm --filter @flowhr/web test:e2e
      - name: Playwright trace 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore
