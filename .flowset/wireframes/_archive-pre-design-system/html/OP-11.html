<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>FlowHR — OP-11 시스템 설정</title>
<link rel="stylesheet" href="_design-tokens.css">
<link rel="stylesheet" href="_icons.css">
<style>
  .settings-layout { display: grid; grid-template-columns: 220px 1fr; gap: 16px; align-items: start; }
  .vert-tabs { background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--r-lg); padding: 8px; box-shadow: var(--shadow-sm); position: sticky; top: 80px; }
  .vert-tab { display: flex; align-items: center; gap: 10px; padding: 10px 12px; font-size: 13px; color: var(--color-text); border-radius: var(--r-sm); cursor: pointer; }
  .vert-tab:hover { background: var(--color-surface); }
  .vert-tab.active { background: var(--color-accent-light); color: var(--color-primary); font-weight: 600; }
  .vert-tab .ico { width: 16px; height: 16px; opacity: 0.7; }
  .form-row { margin-bottom: 16px; }
  .toggle { position: relative; display: inline-block; width: 36px; height: 20px; }
  .toggle input { display: none; }
  .toggle-slider { position: absolute; cursor: pointer; inset: 0; background: var(--color-border); border-radius: 20px; transition: .2s; }
  .toggle-slider::before { content: ''; position: absolute; height: 16px; width: 16px; left: 2px; top: 2px; background: white; border-radius: 50%; transition: .2s; }
  .toggle input:checked + .toggle-slider { background: var(--color-success); }
  .toggle input:checked + .toggle-slider::before { transform: translateX(16px); }
  .footer { padding: 16px 24px; background: var(--color-bg); border-top: 1px solid var(--color-border); display: flex; justify-content: space-between; font-size: 12px; color: var(--color-text-muted); }
  .footer-links { display: flex; gap: 16px; } .footer-links a { color: var(--color-text-muted); text-decoration: none; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></symbol>
  <symbol id="i-building" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/></symbol>
  <symbol id="i-credit-card" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="5" rx="2"/></symbol>
  <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/></symbol>
  <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/></symbol>
  <symbol id="i-scroll" viewBox="0 0 24 24"><path d="M8 21h12a2 2 0 0 0 2-2v-2H10v2a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v3h4"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3"/></symbol>
  <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/></symbol>
  <symbol id="i-tool" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></symbol>
</svg>

<div class="app-shell">
  <nav class="sidebar">
    <div class="sidebar-logo">FlowHR</div>
    <div class="sidebar-menu">
      <div class="sidebar-section-label">운영사</div>
      <a class="sidebar-item"><svg class="ico"><use href="#i-dashboard"/></svg> 대시보드</a>
      <a class="sidebar-item"><svg class="ico"><use href="#i-building"/></svg> 테넌트</a>
      <a class="sidebar-item"><svg class="ico"><use href="#i-credit-card"/></svg> 구독 / 요금제</a>
      <a class="sidebar-item"><svg class="ico"><use href="#i-receipt"/></svg> 청구 / 정산</a>
      <a class="sidebar-item"><svg class="ico"><use href="#i-flag"/></svg> 기능 권한</a>
      <a class="sidebar-item"><svg class="ico"><use href="#i-ticket"/></svg> 지원 티켓</a>
      <a class="sidebar-item"><svg class="ico"><use href="#i-scroll"/></svg> 감사 로그</a>
      <a class="sidebar-item"><svg class="ico"><use href="#i-chart"/></svg> 운영 리포트</a>
      <a class="sidebar-item active"><svg class="ico"><use href="#i-settings"/></svg> 시스템 설정</a>
    </div>
  </nav>

  <div class="main">
    <header class="header">
      <h1 class="page-title">시스템 설정</h1>
      <div style="flex:1;"></div>
      <div class="header-actions">
        <div style="padding:8px;cursor:pointer;color:var(--color-text-muted);"><svg class="ico"><use href="#i-help"/></svg></div>
        <div class="bell"><svg class="ico"><use href="#i-bell"/></svg><span class="bell-badge">3</span></div>
        <div class="avatar">김</div>
      </div>
    </header>

    <main class="content">
      <div class="settings-layout">
        <aside class="vert-tabs">
          <div class="vert-tab"><svg class="ico"><use href="#i-info"/></svg> 기본정보</div>
          <div class="vert-tab"><svg class="ico"><use href="#i-users"/></svg> 운영자 계정</div>
          <div class="vert-tab active"><svg class="ico"><use href="#i-shield"/></svg> 보안</div>
          <div class="vert-tab"><svg class="ico"><use href="#i-mail"/></svg> 메일</div>
          <div class="vert-tab"><svg class="ico"><use href="#i-bell"/></svg> 알림 (카카오/SMS)</div>
          <div class="vert-tab"><svg class="ico"><use href="#i-key"/></svg> API 키</div>
          <div class="vert-tab"><svg class="ico"><use href="#i-database"/></svg> 데이터 보관</div>
          <div class="vert-tab"><svg class="ico"><use href="#i-save"/></svg> 백업</div>
          <div class="vert-tab"><svg class="ico"><use href="#i-tool"/></svg> 점검모드</div>
        </aside>

        <div class="card">
          <h2 style="font-size:18px;font-weight:700;margin-bottom:6px;">보안</h2>
          <p style="font-size:13px;color:var(--color-text-muted);margin-bottom:24px;">로그인·비밀번호·세션·2FA 정책</p>

          <h3 style="font-size:14px;font-weight:600;margin:20px 0 12px;color:var(--color-primary);">비밀번호 정책</h3>
          <div class="form-row" style="display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:center;">
            <label class="label">최소 길이</label>
            <input class="input" type="number" value="10" style="max-width:120px;" />
          </div>
          <div class="form-row" style="display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:center;">
            <label class="label">복잡도</label>
            <div style="display:flex;flex-direction:column;gap:6px;">
              <label style="font-size:13px;display:flex;gap:8px;"><input type="checkbox" checked> 대문자 포함</label>
              <label style="font-size:13px;display:flex;gap:8px;"><input type="checkbox" checked> 소문자 포함</label>
              <label style="font-size:13px;display:flex;gap:8px;"><input type="checkbox" checked> 숫자 포함</label>
              <label style="font-size:13px;display:flex;gap:8px;"><input type="checkbox" checked> 특수문자 포함</label>
            </div>
          </div>
          <div class="form-row" style="display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:center;">
            <label class="label">변경 주기 (일)</label>
            <input class="input" type="number" value="90" style="max-width:120px;" />
          </div>

          <h3 style="font-size:14px;font-weight:600;margin:24px 0 12px;color:var(--color-primary);">잠금 정책</h3>
          <div class="form-row" style="display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:center;">
            <label class="label">실패 시도 수</label>
            <input class="input" type="number" value="5" style="max-width:120px;" />
          </div>
          <div class="form-row" style="display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:center;">
            <label class="label">잠금 시간 (분)</label>
            <input class="input" type="number" value="5" style="max-width:120px;" />
          </div>

          <h3 style="font-size:14px;font-weight:600;margin:24px 0 12px;color:var(--color-primary);">세션</h3>
          <div class="form-row" style="display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:center;">
            <label class="label">access_token 만료</label>
            <select class="input" style="max-width:200px;"><option>1시간 (권장)</option><option>30분</option><option>2시간</option></select>
          </div>
          <div class="form-row" style="display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:center;">
            <label class="label">refresh_token 만료</label>
            <select class="input" style="max-width:200px;"><option>30일 (sliding)</option><option>14일</option><option>7일</option></select>
          </div>

          <h3 style="font-size:14px;font-weight:600;margin:24px 0 12px;color:var(--color-primary);">2단계 인증 (2FA)</h3>
          <div class="form-row" style="display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:center;">
            <label class="label">운영사 2FA 강제</label>
            <div style="display:flex;align-items:center;gap:12px;"><label class="toggle"><input type="checkbox" checked><span class="toggle-slider"></span></label><span style="font-size:13px;color:var(--color-text-muted);">활성 — operator_super/operator_staff 모두 강제</span></div>
          </div>
          <div class="form-row" style="display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:center;">
            <label class="label">테넌트 관리자 2FA 권장</label>
            <div style="display:flex;align-items:center;gap:12px;"><label class="toggle"><input type="checkbox"><span class="toggle-slider"></span></label><span style="font-size:13px;color:var(--color-text-muted);">tenant_super가 가입 시 안내만</span></div>
          </div>

          <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:24px;border-top:1px solid var(--color-border);padding-top:16px;">
            <button class="btn btn-secondary">취소</button>
            <button class="btn btn-primary">저장</button>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div>© 2026 FlowHR</div>
      <div class="footer-links"><a href="/legal/terms">이용약관</a><a href="/legal/privacy">개인정보처리방침</a><a>도움말</a></div>
      <div style="font-family:monospace;">v1.0.0-beta</div>
    </footer>
  </div>
</div>
</body>
</html>
