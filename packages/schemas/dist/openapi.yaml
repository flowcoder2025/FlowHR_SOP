openapi: 3.1.0
info:
  title: FlowHR API
  version: 0.1.0
  description: "FlowHR 멀티테넌트 HR SaaS API 명세. zod 스키마(@flowhr/schemas)에서
    zod-to-openapi 로 자동 생성한다. WI-021-1: ERD 39 entity(snake_case, DB Row 1:1)
    등록. 엔드포인트 req/res 는 Sprint 2~6 점진 확장."
components:
  schemas:
    Login:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          format: email
        password:
          type: string
          minLength: 1
        rememberMe:
          type: boolean
          default: false
      required:
        - email
        - password
    Uuid:
      type: string
      format: uuid
    IsoTimestamp:
      type: string
      format: date-time
    Timestamps:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - created_at
        - updated_at
    PaginationQuery:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    Plan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum:
            - active
            - inactive
            - sales_stopped
            - custom
        base_price_krw:
          type:
            - number
            - "null"
        per_user_price_krw:
          type:
            - number
            - "null"
        included_users:
          type:
            - integer
            - "null"
        modules:
          type: array
          items:
            type: string
        is_public:
          type: boolean
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - status
        - base_price_krw
        - per_user_price_krw
        - included_users
        - modules
        - is_public
        - sort_order
        - created_at
        - updated_at
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        business_number:
          type:
            - string
            - "null"
        representative_name:
          type:
            - string
            - "null"
        industry:
          type:
            - string
            - "null"
        address:
          type:
            - string
            - "null"
        phone:
          type:
            - string
            - "null"
        plan_id:
          type:
            - string
            - "null"
          format: uuid
        status:
          type: string
          enum:
            - active
            - inactive
            - overdue
            - expiring_soon
            - expired
            - archived
        contract_start_date:
          type:
            - string
            - "null"
          format: date
        contract_end_date:
          type:
            - string
            - "null"
          format: date
        user_limit:
          type:
            - integer
            - "null"
        active_user_count:
          type: integer
        admin_user_id:
          type:
            - string
            - "null"
          format: uuid
        logo_url:
          type:
            - string
            - "null"
        metadata:
          type: object
          additionalProperties: {}
        deleted_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - business_number
        - representative_name
        - industry
        - address
        - phone
        - plan_id
        - status
        - contract_start_date
        - contract_end_date
        - user_limit
        - active_user_count
        - admin_user_id
        - logo_url
        - metadata
        - deleted_at
        - created_at
        - updated_at
