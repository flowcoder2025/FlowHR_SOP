          format: date
        paid_at:
          type:
            - string
            - "null"
          format: date
        due_date:
          type:
            - string
            - "null"
          format: date
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - tenant_id
        - subscription_id
        - invoice_number
        - status
        - period_month
        - active_users
        - subtotal_krw
        - tax_krw
